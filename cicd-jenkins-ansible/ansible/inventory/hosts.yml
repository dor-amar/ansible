---
all:
  children:
    development:
      hosts:
        dev-server-1:
          ansible_host: 192.168.1.10
          ansible_user: dev-user
        dev-server-2:
          ansible_host: 192.168.1.11
          ansible_user: dev-user
      vars:
        env_name: development
        app_port: 8080

    staging:
      hosts:
        stage-server-1:
          ansible_host: 192.168.2.10
          ansible_user: stage-user
        stage-server-2:
          ansible_host: 192.168.2.11
          ansible_user: stage-user
      vars:
        env_name: staging
        app_port: 8080

    production:
      hosts:
        prod-server-1:
          ansible_host: 192.168.3.10
          ansible_user: prod-user
        prod-server-2:
          ansible_host: 192.168.3.11
          ansible_user: prod-user
      vars:
        env_name: production
        app_port: 80

  vars:
    ansible_python_interpreter: /usr/bin/python3 